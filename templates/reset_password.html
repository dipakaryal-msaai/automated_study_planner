{% extends "base.html" %}
{% block title %}Reset Password – Study Planner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-1">🔒 Reset Password</h3>
                <p class="text-center text-muted small mb-4">Enter your new password below.</p>

                <form method="POST" action="{{ url_for('reset_password', token=token) }}"
                      id="resetForm">
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               required autofocus minlength="8" placeholder="At least 8 characters">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" required minlength="8"
                               placeholder="Repeat your new password">
                        <div class="invalid-feedback">Passwords do not match.</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Set New Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const form = document.getElementById('resetForm');
    const pw = document.getElementById('password');
    const cpw = document.getElementById('confirm_password');

    function checkMatch() {
        if (cpw.value && pw.value !== cpw.value) {
            cpw.classList.add('is-invalid');
        } else {
            cpw.classList.remove('is-invalid');
        }
    }
    pw.addEventListener('input', checkMatch);
    cpw.addEventListener('input', checkMatch);

    form.addEventListener('submit', function (e) {
        if (pw.value !== cpw.value) {
            e.preventDefault();
            cpw.classList.add('is-invalid');
        }
    });
})();
</script>
{% endblock %}
