{% extends "base.html" %}
{% block title %}Login – Study Planner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">🔐 Log In</h3>

                <form method="POST" action="{{ url_for('auth_login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email"
                               required autofocus placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               required placeholder="••••••••">
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                    </div>
                </form>

                <hr>
                <p class="text-center mb-2">
                    Don't have an account?
                    <a href="{{ url_for('auth_register') }}">Register here</a>
                </p>
                <p class="text-center">
                    <a href="{{ url_for('enter_guest') }}" class="text-muted small">
                        Continue as guest (data won't be saved)
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
